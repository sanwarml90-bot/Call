plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android { namespace 'com.smartdialer'; compileSdk 36
    defaultConfig { applicationId 'com.smartdialer'; minSdk 29; targetSdk 36; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.biometric:biometric:1.4.0-alpha04'
    testImplementation 'junit:junit:4.13.2'
}
